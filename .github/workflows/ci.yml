name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Comprobar sintaxis del script
        run: python -m py_compile auto_improver.py

      - name: Validar YAML (action y ejemplo)
        run: |
          python -m pip install --quiet pyyaml
          python - <<'EOF'
          import yaml
          for f in ("action.yml", "ejemplo-workflow.yml"):
              yaml.safe_load(open(f, encoding="utf-8"))
              print("OK", f)
          EOF
