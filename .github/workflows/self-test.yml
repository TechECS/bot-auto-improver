# Prueba manual de la action sobre este mismo repo (usa el código local con `uses: ./`).
# Necesita: variable APP_CLIENT_ID, secretos APP_PRIVATE_KEY y GEMINI_API_KEY, y la GitHub App
# instalada en este repo. La PR la abre "<app>[bot]" con un token temporal de la App, así que
# no hace falta activar "Allow GitHub Actions to create and approve pull requests".

name: Self-test

on:
  workflow_dispatch:
    inputs:
      focus:
        description: "Foco de la revisión"
        type: choice
        default: auto
        options: [auto, rotar, bugs, tests, seguridad, docs, accesibilidad, funcionalidad]
      model:
        description: "Modelo o lista separada por comas (vacío = lista por defecto del bot)"
        type: string
        default: ""
      probe:
        description: "Sondear qué modelos responden con tu clave (no crea nada)"
        type: boolean
        default: false
      protect_bot:
        description: "Proteger auto_improver.py y action.yml (si no, el bot puede mejorarse a sí mismo)"
        type: boolean
        default: false
      context:
        description: "Contexto extra para el bot (qué quieres que priorice)"
        type: string
        default: ""
      dry_run:
        description: "Solo mostrar la propuesta (no crea rama ni PR)"
        type: boolean
        default: false

permissions:
  contents: read   # el trabajo real lo hace el token de la GitHub App

concurrency:
  group: self-test
  cancel-in-progress: false

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Token temporal (1 h) de la App, solo con los permisos necesarios.
      # Issues: para crear la etiqueta `auto-improver`.
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID || secrets.APP_CLIENT_ID }}   # vale como variable o como secreto
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: ./
        with:
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          github-token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}   # commits con la identidad real de la App
          focus: ${{ github.event.inputs.focus || 'auto' }}
          dry-run: ${{ github.event.inputs.dry_run || 'false' }}
          language: es
          probe: ${{ github.event.inputs.probe || 'false' }}
          model: ${{ github.event.inputs.model }}
          context: ${{ github.event.inputs.context }}
          # Por defecto el bot SÍ puede proponer mejoras sobre sí mismo (solo PR, nunca merge).
          # Marca "protect_bot" si quieres que no toque su propio código.
          protected: ${{ github.event.inputs.protect_bot == 'true' && 'auto_improver.py,action.yml' || '' }}
          test-command: python -m py_compile auto_improver.py git_context.py project_detector.py && python -m unittest discover -v
