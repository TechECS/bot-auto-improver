name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Comprobar sintaxis de los scripts
        run: python -m py_compile auto_improver.py git_context.py project_detector.py

      - name: Tests unitarios
        run: python -m unittest discover -v

      - name: Validar YAML (action, ejemplo y workflows)
        run: |
          python -m pip install --quiet pyyaml
          python - <<'EOF'
          import glob
          import yaml
          files = ["action.yml", "ejemplo-workflow.yml"]
          files += sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml"))
          for f in files:
              with open(f, encoding="utf-8") as fh:
                  yaml.safe_load(fh)
              print("OK", f)
          EOF
